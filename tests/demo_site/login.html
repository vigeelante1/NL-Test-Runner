<!doctype html>
<html><head><meta charset="utf-8"><title>Demo Shop - Login</title>
<style>
body{font-family:sans-serif;margin:40px}
#notice{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
#notice div{background:#fff;padding:24px;border-radius:8px}
.error{color:#b00}
</style></head>
<body>
<h1>Welcome Back</h1>
<p>Sign in to your account to continue</p>
<form id="f">
  <p><label>Email Address <input type="email" id="e" placeholder="Email Address"></label></p>
  <p><label>Password <input type="password" id="p" placeholder="Password"></label></p>
  <p><label><input type="checkbox" id="rm"> Remember me</label></p>
  <button type="submit">Sign In</button>
  <p class="error" id="err"></p>
</form>
<p><a href="help.html" target="_blank">Help (opens new tab)</a></p>

<!-- A notice that covers the page until dismissed, like the real demo site -->
<div id="notice"><div><p>This is a demo site. Data is reset daily.</p>
<button onclick="document.getElementById('notice').remove()">I Understand &amp; Continue</button></div></div>

<script>
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  const ok = document.getElementById('e').value === 'demo@example.com' && document.getElementById('p').value === 'secret123';
  if (ok) location.href = 'dashboard.html';
  else document.getElementById('err').textContent = 'Invalid email or password';
});
</script>
</body></html>
